{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>My Pocket - Grocery Guide</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"/>
</head>
<body>
    <div class="container py-5 mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow border-0 rounded-3 p-4 text-center">
                    <div class="card-body">
                        <i class="fas fa-wallet fa-3x text-primary mb-3"></i>
                        <h2 class="fw-bold mb-3">My Pocket Balance</h2>
                        <div class="bg-light rounded p-4 mb-4">
                            <h1 class="display-4 text-success fw-bold">₹{{ pocket.balance }}</h1>
                            <p class="text-muted mb-0">Available reward credits from delivered orders</p>
                        </div>
                        <a href="{% url 'home' %}" class="btn border border-secondary rounded-pill px-4 text-primary">Back to Home</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
